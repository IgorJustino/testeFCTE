<!DOCTYPE html>
<html>
<head>
    <title>Teste de Login</title>
</head>
<body>
    <h1>Teste de Login - Django API</h1>
    
    <form id="loginForm">
        <div>
            <label>Email:</label>
            <input type="email" id="email" value="teste@teste.com" required>
        </div>
        <div>
            <label>Senha:</label>
            <input type="password" id="password" value="123456" required>
        </div>
        <button type="submit">Fazer Login</button>
    </form>

    <div id="result"></div>
    <div id="userInfo"></div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            const userInfoDiv = document.getElementById('userInfo');
            
            try {
                resultDiv.innerHTML = 'Fazendo login...';
                
                const response = await fetch('http://127.0.0.1:8000/api/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (data.success && data.user) {
                    resultDiv.innerHTML = '<h3 style="color: green;">Login realizado com sucesso!</h3>';
                    userInfoDiv.innerHTML = `
                        <h4>Dados do usuário:</h4>
                        <pre>${JSON.stringify(data.user, null, 2)}</pre>
                        <p><strong>LocalStorage:</strong></p>
                        <pre>${JSON.stringify(data.user, null, 2)}</pre>
                    `;
                    
                    // Simular o que o frontend faz
                    localStorage.setItem('django_user', JSON.stringify(data.user));
                    
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">Erro: ${data.message}</p>`;
                }
                
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Erro de conexão: ${error.message}</p>`;
            }
        });

        // Verificar se já há usuário salvo
        const savedUser = localStorage.getItem('django_user');
        if (savedUser) {
            document.getElementById('userInfo').innerHTML = `
                <h4>Usuário já logado (localStorage):</h4>
                <pre>${savedUser}</pre>
                <button onclick="localStorage.removeItem('django_user'); location.reload();">Logout</button>
            `;
        }
    </script>
</body>
</html>
