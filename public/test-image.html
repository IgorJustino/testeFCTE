<!DOCTYPE html>
<html>
<head>
    <title>Teste de Imagem</title>
</head>
<body>
    <h1>Teste de Carregamento de Imagem</h1>
    
    <div id="results"></div>
    
    <h2>Teste 1: Imagem direta</h2>
    <img 
        src="http://127.0.0.1:54321/storage/v1/object/public/products/products/2/1763241721_c0065844_dijkstra.jpg" 
        alt="Teste direto"
        style="max-width: 300px;"
        onload="console.log('Imagem carregada com sucesso!')"
        onerror="console.error('Erro ao carregar imagem!')"
    />

    <h2>Teste 2: Via API</h2>
    <div id="api-image"></div>
    
    <h2>Teste 3: Via fetch</h2>
    <div id="fetch-result"></div>

    <script>
        // Teste da API
        fetch('http://127.0.0.1:8000/api/products/2/')
            .then(response => response.json())
            .then(data => {
                console.log('API Response:', data);
                document.getElementById('results').innerHTML = `
                    <h3>Dados da API:</h3>
                    <p><strong>Título:</strong> ${data.title}</p>
                    <p><strong>Image URL:</strong> ${data.image_url}</p>
                `;
                
                if (data.image_url) {
                    const img = document.createElement('img');
                    img.src = data.image_url;
                    img.style.maxWidth = '300px';
                    img.onload = () => console.log('Imagem da API carregada!');
                    img.onerror = () => console.error('Erro na imagem da API!');
                    document.getElementById('api-image').appendChild(img);
                }
            })
            .catch(error => {
                console.error('Erro na API:', error);
            });

        // Teste direto da imagem
        fetch('http://127.0.0.1:54321/storage/v1/object/public/products/products/2/1763241721_c0065844_dijkstra.jpg')
            .then(response => {
                console.log('Fetch direto status:', response.status);
                document.getElementById('fetch-result').innerHTML = `
                    <p>Status: ${response.status}</p>
                    <p>Headers: ${JSON.stringify([...response.headers.entries()])}</p>
                `;
            })
            .catch(error => {
                console.error('Erro no fetch direto:', error);
                document.getElementById('fetch-result').innerHTML = `<p>Erro: ${error.message}</p>`;
            });
    </script>
</body>
</html>
